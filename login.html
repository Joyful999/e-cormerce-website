<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — LUXORA</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="login">

<div id="headerMount"></div>

<section class="section">
  <div class="wrap auth-wrap">
    <div class="auth-tabs">
      <a href="login.html" class="active">Sign In</a>
      <a href="register.html">Register</a>
    </div>
    <form id="loginForm" novalidate>
      <div class="field">
        <label>Email</label>
        <input type="email" name="email" placeholder="you@example.com">
        <span class="field-error">Enter a valid email address</span>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••">
        <span class="field-error">Password must be at least 4 characters</span>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;">
        <label class="checkbox-row"><input type="checkbox" name="remember"> Remember me</label>
        <a href="#" style="font-size:12.5px;text-decoration:underline;">Forgot password?</a>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Sign In</button>
    </form>
    <p class="auth-note">Demo authentication — this form does not connect to a real account system. Data is stored locally in your browser only.</p>
  </div>
</section>

<div id="footerMount"></div>

<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/state.js"></script>
<script src="js/components.js"></script>
<script src="js/app.js"></script>
<script src="js/search.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/checkout.js"></script>
<script src="js/account.js"></script>
<script src="js/auth.js"></script>
</body>
</html>

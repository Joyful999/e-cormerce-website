<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop — LUXORA</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="shop">

<div id="headerMount"></div>

<section class="section" style="padding-top:48px;">
  <div class="wrap">
    <span class="eyebrow">Discovery</span>
    <h1 class="section-title" id="discoveryTitle" style="margin-top:8px;">Shop All</h1>
    <p id="discoverySub" style="color:var(--ink-soft);margin-top:6px;"></p>

    <div class="shop-layout" style="margin-top:36px;">
      <aside class="filters-panel" id="filtersPanel"></aside>

      <div>
        <div class="shop-toolbar">
          <div style="display:flex;align-items:center;gap:14px;">
            <span class="results-count" id="resultsCount"></span>
            <button class="btn btn-outline btn-sm mobile-filter-btn" id="mobileFilterBtn">Filters</button>
          </div>
          <div class="toolbar-right">
            <select class="select-sort" id="sortSelect">
              <option value="featured">Featured</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
              <option value="rating">Highest Rated</option>
              <option value="newest">Newest</option>
            </select>
            <div class="view-toggle">
              <button class="active" id="gridViewBtn" aria-label="Grid view">▦</button>
              <button id="listViewBtn" aria-label="List view">☰</button>
            </div>
          </div>
        </div>
        <div class="grid-products" id="productsGrid"></div>
        <div id="loadMoreWrap" style="display:none;justify-content:center;margin-top:40px;">
          <button class="btn btn-outline" id="loadMoreBtn">Load More</button>
        </div>
      </div>
    </div>
  </div>
</section>

<div class="drawer" id="mobileFiltersDrawer" aria-label="Filters">
  <div class="drawer-head"><h3>Filters</h3><button class="btn-icon" id="closeMobileFilters">✕</button></div>
  <div class="drawer-body filters-drawer-body" id="mobileFiltersBody"></div>
</div>

<div id="footerMount"></div>

<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/state.js"></script>
<script src="js/components.js"></script>
<script src="js/app.js"></script>
<script src="js/search.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/checkout.js"></script>
<script src="js/account.js"></script>
<script src="js/auth.js"></script>
</body>
</html>

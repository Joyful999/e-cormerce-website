<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — LUXORA</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
<style>.zoomed{ transform: scale(1.5); cursor: zoom-out; }</style>
</head>
<body data-page="product">

<div id="headerMount"></div>

<section class="section" style="padding-top:40px;">
  <div class="wrap" id="productMount"></div>
</section>

<section class="section" style="border-top:1px solid var(--stone);">
  <div class="wrap">
    <div class="section-head"><div><span class="eyebrow">You may also like</span><h2 class="section-title">Related Products</h2></div></div>
    <div class="grid-products" id="relatedGrid"></div>
  </div>
</section>

<section class="section" style="display:none;padding-top:0;">
  <div class="wrap">
    <div class="section-head"><div><span class="eyebrow">Continue browsing</span><h2 class="section-title">Recently Viewed</h2></div></div>
    <div class="grid-products" id="pdRecentWrap" style="grid-template-columns:repeat(6,1fr);"></div>
  </div>
</section>

<div id="footerMount"></div>

<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/state.js"></script>
<script src="js/components.js"></script>
<script src="js/app.js"></script>
<script src="js/search.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/checkout.js"></script>
<script src="js/account.js"></script>
<script src="js/auth.js"></script>
</body>
</html>

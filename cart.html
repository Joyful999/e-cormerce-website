<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Bag — LUXORA</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="cart">

<div id="headerMount"></div>

<section class="section" style="padding-top:48px;">
  <div class="wrap">
    <span class="eyebrow">Your Bag</span>
    <h1 class="section-title" style="margin-top:8px;margin-bottom:36px;">Shopping Bag</h1>

    <div id="cartEmptyState" style="display:none;"></div>

    <div style="display:grid;grid-template-columns:1fr 360px;gap:48px;align-items:flex-start;">
      <div id="cartTableWrap" style="overflow-x:auto;">
        <table class="cart-table">
          <thead>
            <tr style="text-align:left;border-bottom:2px solid var(--stone);">
              <th style="padding:12px;font-size:12px;text-transform:uppercase;color:var(--ink-soft);">Product</th>
              <th style="padding:12px;font-size:12px;text-transform:uppercase;color:var(--ink-soft);">Price</th>
              <th style="padding:12px;font-size:12px;text-transform:uppercase;color:var(--ink-soft);">Quantity</th>
              <th style="padding:12px;font-size:12px;text-transform:uppercase;color:var(--ink-soft);">Subtotal</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="cartItemsBody"></tbody>
        </table>

        <div id="savedForLaterWrap" style="margin-top:50px;display:none;">
          <h3 style="margin-bottom:20px;">Saved for Later</h3>
          <div class="grid-products" id="savedItemsGrid"></div>
        </div>
      </div>

      <aside class="cart-summary" id="cartSummary">
        <h3 style="margin-bottom:16px;">Order Summary</h3>
        <div class="summary-row"><span>Subtotal</span><span id="sumSubtotal">$0.00</span></div>
        <div class="summary-row"><span>Discount</span><span id="sumDiscount">$0.00</span></div>
        <div class="summary-row"><span>Shipping</span><span id="sumShipping">$0.00</span></div>
        <div class="summary-row"><span>Tax</span><span id="sumTax">$0.00</span></div>

        <div class="coupon-row" id="couponForm">
          <input type="text" id="couponInput" placeholder="Enter promo code">
          <button class="btn btn-outline btn-sm" id="applyCouponBtn">Apply</button>
        </div>
        <div class="coupon-applied" id="couponAppliedWrap" style="display:none;">
          <span></span><button class="btn-icon" id="removeCouponBtn" style="width:24px;height:24px;">✕</button>
        </div>
        <p style="font-size:11px;color:var(--ink-soft);margin:6px 0 14px;">Try demo codes: LUXORA10, WELCOME15, SAVE20</p>

        <div class="summary-row total"><span>Total</span><span id="sumTotal">$0.00</span></div>
        <a href="checkout.html" class="btn btn-primary btn-block" style="margin-top:18px;">Proceed to Checkout</a>
        <a href="shop.html" class="btn btn-ghost btn-block" style="margin-top:8px;">Continue Shopping</a>
      </aside>
    </div>
  </div>
</section>

<div id="footerMount"></div>

<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/state.js"></script>
<script src="js/components.js"></script>
<script src="js/app.js"></script>
<script src="js/search.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/checkout.js"></script>
<script src="js/account.js"></script>
<script src="js/auth.js"></script>
</body>
</html>

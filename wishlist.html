<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wishlist — LUXORA</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="wishlist">

<div id="headerMount"></div>

<section class="section" style="padding-top:48px;">
  <div class="wrap">
    <div class="section-head">
      <div><span class="eyebrow">Saved for you</span><h1 class="section-title" style="margin-top:8px;">Wishlist (<span id="wishlistCount">0</span>)</h1></div>
      <button class="btn btn-ghost" id="clearWishlistBtn">Clear Wishlist</button>
    </div>
    <div id="wishlistEmpty" style="display:none;"></div>
    <div class="grid-products" id="wishlistGrid"></div>
  </div>
</section>

<div id="footerMount"></div>

<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/state.js"></script>
<script src="js/components.js"></script>
<script src="js/app.js"></script>
<script src="js/search.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/checkout.js"></script>
<script src="js/account.js"></script>
<script src="js/auth.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('wishlistEmpty').innerHTML = Components.emptyState('Your wishlist is empty', 'Tap the heart icon on any product to save it here.', '<a href="shop.html" class="btn btn-primary">Browse Products</a>');
});
</script>
</body>
</html>

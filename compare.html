<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compare Products — LUXORA</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="compare">

<div id="headerMount"></div>

<section class="section" style="padding-top:48px;">
  <div class="wrap">
    <span class="eyebrow">Side by side</span>
    <h1 class="section-title" style="margin:8px 0 36px;">Compare Products</h1>
    <div id="compareEmpty" style="display:none;"></div>
    <div id="compareWrap" style="overflow-x:auto;"></div>
  </div>
</section>

<div id="footerMount"></div>

<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/state.js"></script>
<script src="js/components.js"></script>
<script src="js/app.js"></script>
<script src="js/search.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/checkout.js"></script>
<script src="js/account.js"></script>
<script src="js/auth.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('compareEmpty').innerHTML = Components.emptyState('No products to compare', 'Use the compare icon on a product page to add up to 3 items here.', '<a href="shop.html" class="btn btn-primary">Browse Products</a>');
});
</script>
</body>
</html>
